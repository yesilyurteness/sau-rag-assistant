# Source manifest for the ingestion pipeline (see docs/design/stage1-step1-ingestion.md).
#
# Only files listed here (or matched by a [[pattern]]) are ingested. Everything else in the source
# folder is reported as "unregistered" and ignored. This file holds metadata only, never content.
#
# Fields: name | kind | title | academic_year | status | access | valid_from | valid_until | skip | notes
# kind:   course_package | faq | decisions | procedure | narrative | announcement | slides | tabular
# status: current | superseded   (superseded documents stay searchable but rank below current ones)

[defaults]
academic_year = "2025-2026"  # the 2025-2026 snapshot (data-scope decision of 2026-11-10)
status = "current"
access = "public"

# --- Structured data: registered here, loaded into SQL tables in step 2 (no vector chunks) -------------

