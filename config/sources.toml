# --- Pattern rules (an exact [[source]] entry always wins) -------------------------------------------------

[[pattern]]
glob = "*.txt"
kind = "course_package"
# Course information packages: one file per course, e.g. "Matematik 1.txt". A .txt file that does not
# parse as a course package is skipped with an error in the report instead of being indexed as noise.
